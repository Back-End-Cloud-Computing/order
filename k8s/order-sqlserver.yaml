apiVersion: v1
kind: Service
metadata:
  name: order-sqlserver
  labels:
    app.kubernetes.io/name: order-sqlserver
    app.kubernetes.io/part-of: ganjj
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: order-sqlserver
  ports:
    - name: tds
      port: 1433
      targetPort: tds
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-sqlserver
  labels:
    app.kubernetes.io/name: order-sqlserver
    app.kubernetes.io/part-of: ganjj
spec:
  serviceName: order-sqlserver
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-sqlserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-sqlserver
        app.kubernetes.io/part-of: ganjj
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - name: tds
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-secrets
                  key: sqlserver-sa-password
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
                  -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
                  -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: tds
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: order-sql-data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: order-sql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi

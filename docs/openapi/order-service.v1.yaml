openapi: 3.1.0
info:
  title: GANJJ Order Service API
  version: 1.0.0
  description: >-
    Public contract implemented by the independently deployed GANJJ order
    microservice. Prices and items are obtained server-to-server from Shopping
    Cart; external clients never submit prices. The integration uses the current
    Cart item snapshot, while versioned checkout quotes remain pending.
servers:
  - url: http://localhost:3004
    description: Direct local container access
  - url: http://localhost:3000
    description: Local API Gateway
tags:
  - name: Pedidos
  - name: Administração
  - name: Health
paths:
  /api/pedidos:
    post:
      tags: [Pedidos]
      summary: Criar pedido a partir do carrinho autenticado
      operationId: criarPedido
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPedidoRequest'
            example:
              endereco_entrega:
                rua: Rua das Flores
                numero: '123'
                complemento: Apto 42
                bairro: Centro
                cidade: Curitiba
                estado: PR
                cep: 80000-000
                pais: BR
      responses:
        '201':
          description: Pedido criado
          headers:
            Location:
              description: URL do pedido criado
              schema:
                type: string
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoCriado'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '409':
          description: Carrinho/cotação/estoque/idempotência em conflito
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Produto referenciado pelo carrinho não encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerProblem'
        '502':
          $ref: '#/components/responses/BadGatewayProblem'
        '503':
          $ref: '#/components/responses/DependencyUnavailableProblem'

  /api/pedidos/meus:
    get:
      tags: [Pedidos]
      summary: Listar pedidos do cliente autenticado
      operationId: listarMeusPedidos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pedidos em ordem decrescente de criação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /api/pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Consultar um pedido
      operationId: obterPedido
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Snapshot completo do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /api/pedidos/admin/todos:
    get:
      tags: [Administração]
      summary: Listar todos os pedidos
      description: Requer papel de administrador.
      operationId: listarTodosPedidos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Todos os pedidos em ordem decrescente de criação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /api/pedidos/{id}/passo:
    put:
      tags: [Administração]
      summary: Atualizar passo de rastreio
      description: >-
        Requer administrador. Passos 0-2 resultam em pending, 3-4 em
        shipping e 5 em completed.
      operationId: atualizarPassoPedido
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarPassoRequest'
            example:
              passo: 3
              numero_rastreio: BR123456789
      responses:
        '200':
          description: Passo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: Conflito de atualização concorrente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /health:
    get:
      tags: [Health]
      summary: Saúde básica do serviço
      operationId: health
      security: []
      responses:
        '200':
          description: Serviço saudável
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/live:
    get:
      tags: [Health]
      summary: Liveness do processo
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Processo saudável
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness incluindo SQL Server
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Serviço pronto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Serviço não está pronto

  /instance:
    get:
      tags: [Diagnostics]
      summary: Identifica o Pod que atendeu a requisição
      operationId: getInstance
      security: []
      responses:
        '200':
          description: Instância identificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave estável para impedir checkout duplicado.
      schema:
        type: string
        minLength: 8
        maxLength: 100
      example: 7bf75c1c-8277-4295-9061-ec2ea05b4baa
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    CorrelationId:
      description: Identificador de correlação efetivo da requisição.
      schema:
        type: string

  responses:
    ValidationProblem:
      description: Requisição inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    UnauthorizedProblem:
      description: Token ausente, inválido ou expirado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenProblem:
      description: Identidade válida sem autorização para o recurso
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundProblem:
      description: Pedido não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DependencyUnavailableProblem:
      description: Dependência necessária ao checkout indisponível
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadGatewayProblem:
      description: Resposta de uma dependência não corresponde ao contrato esperado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerProblem:
      description: Falha inesperada ou falha ao compensar o checkout
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    CriarPedidoRequest:
      type: object
      additionalProperties: false
      required: [endereco_entrega]
      properties:
        endereco_entrega:
          $ref: '#/components/schemas/EnderecoEntrega'

    EnderecoEntrega:
      type: object
      additionalProperties: false
      required: [rua, numero, bairro, cidade, estado, cep, pais]
      properties:
        rua:
          type: string
          minLength: 1
          maxLength: 200
        numero:
          type: string
          minLength: 1
          maxLength: 30
        complemento:
          type: [string, 'null']
          maxLength: 100
        bairro:
          type: string
          minLength: 1
          maxLength: 100
        cidade:
          type: string
          minLength: 1
          maxLength: 100
        estado:
          type: string
          minLength: 1
          maxLength: 50
        cep:
          type: string
          minLength: 1
          maxLength: 20
        pais:
          type: string
          minLength: 1
          maxLength: 2

    PedidoCriado:
      type: object
      required: [id, codigo, status, passo, total, criado_em]
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: '#GNJ-20260821-0001'
        status:
          $ref: '#/components/schemas/StatusPedido'
        passo:
          type: integer
          minimum: 0
          maximum: 5
        total:
          type: number
          multipleOf: 0.01
        criado_em:
          type: string
          format: date-time

    Pedido:
      type: object
      required:
        - id
        - codigo
        - cliente_id
        - status
        - passo
        - total
        - endereco_entrega
        - itens
        - criado_em
        - atualizado_em
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: '#GNJ-20260821-0001'
        cliente_id:
          type: string
          format: uuid
        cliente_nome:
          type: [string, 'null']
        cliente_email:
          type: [string, 'null']
          format: email
        status:
          $ref: '#/components/schemas/StatusPedido'
        passo:
          type: integer
          minimum: 0
          maximum: 5
        numero_rastreio:
          type: [string, 'null']
        total:
          type: number
          multipleOf: 0.01
        endereco_entrega:
          $ref: '#/components/schemas/EnderecoEntrega'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedido'
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time

    ItemPedido:
      type: object
      required:
        - produto_id
        - nome
        - quantidade
        - preco_unitario
        - subtotal
      properties:
        produto_id:
          type: string
          minLength: 1
          maxLength: 64
        nome:
          type: string
        cor:
          type: [string, 'null']
        imagem_url:
          type: [string, 'null']
          format: uri
        quantidade:
          type: integer
          minimum: 1
        preco_unitario:
          type: number
          minimum: 0
          multipleOf: 0.01
        subtotal:
          type: number
          minimum: 0
          multipleOf: 0.01

    AtualizarPassoRequest:
      type: object
      additionalProperties: false
      required: [passo]
      properties:
        passo:
          type: integer
          minimum: 0
          maximum: 5
        numero_rastreio:
          type: [string, 'null']

    StatusPedido:
      type: string
      enum: [Pending, Shipping, Completed, Cancelled, Failed]

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        checks:
          type: object
          additionalProperties:
            type: string

    InstanceResponse:
      type: object
      required: [pod]
      properties:
        pod:
          type: string

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        code:
          type: string
      additionalProperties: true

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
